<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360.56554" height="291.94327" viewBox="0,0,360.56554,291.94327"><g transform="translate(-59.71723,-34.02836)"><g stroke="none" stroke-miterlimit="10"><path d="M59.71723,325.97164v-291.94327h360.56554v291.94327z" fill="#dbdbdb" stroke-width="0"/><text transform="translate(186.43094,76.14407) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Circle Sort</tspan></text><text transform="translate(71.76807,121.92859) scale(0.45049,0.45049)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Compare the first element to the </tspan><tspan x="0" dy="46.150000000000006px">last element, then the second element </tspan><tspan x="0" dy="46.150000000000006px">to the second last element, and etc.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Splits the array to two and recurse until </tspan><tspan x="0" dy="46.150000000000006px">there is only one single element in the </tspan><tspan x="0" dy="46.150000000000006px">array.</tspan></text><text transform="translate(94.69675,285.70399) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Complexity: O(n )</tspan></text><text transform="translate(245.144,275.48591) scale(0.33391,0.33391)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">2</tspan></text></g></g></svg>