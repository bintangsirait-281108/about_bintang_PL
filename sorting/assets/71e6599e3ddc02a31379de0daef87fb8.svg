<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360.56554" height="291.94327" viewBox="0,0,360.56554,291.94327"><g transform="translate(-59.71723,-34.02837)"><g stroke="none" stroke-miterlimit="10"><path d="M59.71723,325.97164v-291.94327h360.56554v291.94327z" fill="#dbdbdb" stroke-width="0"/><text transform="translate(151.43094,73.14407) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Cocktail Shaker Sort</tspan></text><text transform="translate(71.76807,123.64229) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Same as the Bubble Sort, however,</tspan><tspan x="0" dy="46.150000000000006px">it's bidirectional.</tspan><tspan x="0" dy="46.150000000000006px">Right --&gt; Moves largest item to</tspan><tspan x="0" dy="46.150000000000006px">the right.</tspan><tspan x="0" dy="46.150000000000006px">Left --&gt; Moves smallest item to</tspan><tspan x="0" dy="46.150000000000006px">the left.</tspan></text><text transform="translate(94.69675,285.70399) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Complexity: O(n )</tspan></text><text transform="translate(245.144,275.48591) scale(0.33391,0.33391)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">2</tspan></text></g></g></svg>