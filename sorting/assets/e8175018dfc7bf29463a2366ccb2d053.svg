<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360.56554" height="291.94327" viewBox="0,0,360.56554,291.94327"><g transform="translate(-59.71723,-34.02836)"><g stroke="none" stroke-miterlimit="10"><path d="M59.71723,325.97164v-291.94327h360.56554v291.94327z" fill="#dbdbdb" stroke-width="0"/><text transform="translate(182.43094,73.14407) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Comb Sort</tspan></text><text transform="translate(69.76807,115.03126) scale(0.42238,0.42238)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Comb Sort improves on Bubble Sort by </tspan><tspan x="0" dy="46.150000000000006px">using a gap of the size of more than 1. </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">The gap starts with a large value and </tspan><tspan x="0" dy="46.150000000000006px">shrinks by a factor of 1.3 in every iteration </tspan><tspan x="0" dy="46.150000000000006px">until it reaches the value 1.</tspan></text><text transform="translate(94.69675,285.70399) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Complexity: O(n log n)</tspan></text></g></g></svg>